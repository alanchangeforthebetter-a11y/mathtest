<header><h1>📘 指數與對數函數｜基本題複習</h1>
<p>步驟：①看重點 → ②先自己算例題再看解 → ③做隨堂練習 → ④誠實按「懂了」或「再看看」。</p>

<script>
const R=String.raw;
const C=[
{u:'2-1',t:R`指數型成長 vs 線性成長`,
k:R`$x$ 每增加 $1$：函數值「乘固定倍數」→ 指數型成長；「加固定的數」→ 線性成長。<br>例：$f(x)=2^x$ 每次 $\times 2$；$g(x)=2x+10$ 每次 $+2$。`,
e:{q:R`$f(x)$：$x=0,1,2,3$ 時為 $10,20,40,80$。是哪一種成長？`,a:R`每次都 $\times 2$（等比）→ 指數型成長，$f(x)=10\cdot 2^x$。`},
p:[{q:R`$g(x)$：$100,120,144,172.8$；$f(x)$：$0.3,15.3,30.3,45.3$。何者是指數型成長？`,a:R`$g(x)$。$\frac{120}{100}=\frac{144}{120}=1.2$（等比）；$f(x)$ 每次 $+15$（等差），是線性成長。`}]},
{u:'2-1',t:R`指數函數 $f(x)=a^x$ 的圖形性質`,
k:R`$a>0$ 且 $a\neq 1$。圖形都在 $x$ 軸上方、過 $(0,1)$。<br>$a>1$：左下→右上（嚴格遞增）；$0<a<1$：左上→右下（嚴格遞減）。<br>$a^x$ 與 $a^{-x}$ 的圖形對稱 $y$ 軸；圖形凹口向上；水平線 $y=b\ (b>0)$ 恰交一點。`,
e:{q:R`圖中 $y=a^x,\ b^x,\ c^x,\ d^x$，比較 $a,b,c,d$ 與 $1$ 的大小。`,a:R`畫直線 $x=1$，交點的 $y$ 坐標就是底數。結果：$b<a<1<d<c$。`},
p:[{q:R`$f(x)=3^x$，哪些正確？<br>(A) $f(3)>f(\pi)$　(B) 任何水平線都與圖形有交點　(C) 與 $\left(\frac13\right)^x$ 對稱 $y$ 軸　(D) 圖形上任兩點的斜率為正　(E) 任一鉛直線與圖形只有一個交點`,a:R`答案 CDE。(A) $3<\pi$ 且遞增，所以 $f(3)<f(\pi)$；(B) $y\le 0$ 的水平線沒有交點。`}]},
{u:'2-1',t:R`比較指數的大小`,
k:R`①化成同底數　②看底數：$a>1$ 時指數大則值大；$0<a<1$ 時指數大則值小。`,
e:{q:R`比較 $a=\sqrt{0.5},\ b=(0.25)^{1.1},\ c=(0.5)^3,\ d=4$。`,a:R`全化成 $0.5$ 的次方：$a=0.5^{\frac12}$，$b=0.5^{2.2}$，$c=0.5^{3}$，$d=0.5^{-2}$。底數 $<1$ 遞減，指數越大值越小：$d>a>b>c$。`},
p:[{q:R`比較 $a=0.9^{0.3},\ b=0.9^{\frac13},\ c=0.9^{0.2}$。`,a:R`底數 $0.9<1$ 遞減，指數 $0.2<0.3<\frac13$，所以 $c>a>b$。`}]},
{u:'2-1',t:R`按比例成長：$g(x)=c\cdot a^x$`,
k:R`$c$ 是初始值（$x=0$ 時的值）。圖形是 $a^x$ 鉛直伸縮 $c$ 倍。<br>半衰期 $T$：$f(x)=k\left(\frac12\right)^{\frac{x}{T}}$。加倍期 $T$：$f(x)=k\cdot 2^{\frac{x}{T}}$。`,
e:{q:R`每 $24$ 個月加倍，起初 $1000$ 個，$t$ 個月後 $f(t)=?$`,a:R`經過 $\frac{t}{24}$ 次加倍：$f(t)=1000\times 2^{\frac{t}{24}}$。`},
p:[{q:R`大腸桿菌每 $20$ 分鐘變 $2$ 倍，起初 $10^3$ 個，$t$ 分鐘後 $f(t)=?$`,a:R`$f(t)=10^3\times 2^{\frac{t}{20}}$。`},
{q:R`藥物最大濃度 $10$ mg/L，半衰期 $3$ 小時，$12$ 小時後濃度？`,a:R`$12\div 3=4$ 次半衰期：$10\times\left(\frac12\right)^4=0.625$ mg/L。`},
{q:R`$f(x)=(0.7)^x$ 鉛直伸縮幾倍得 $g(x)=0.5\,(0.7)^x$？`,a:R`$0.5$ 倍。`}]},
{u:'2-1',t:R`解指數方程式與不等式`,
k:R`方程式：化成同底，指數相等。若是 $t=a^x$ 的二次式，先令 $t$，記得 $t>0$。<br>不等式：化同底後看底數——$a>1$ 不等號方向不變；$0<a<1$ 不等號要反向。`,
e:{q:R`解 $\left(\frac14\right)^x=\left(\frac12\right)^{x-1}$；解 $2^{2x}<8$。`,a:R`$\left(\frac12\right)^{2x}=\left(\frac12\right)^{x-1}$ → $2x=x-1$ → $x=-1$。<br>$2^{2x}<2^3$，底數 $>1$ → $2x<3$ → $x<\frac32$。`},
p:[{q:R`解 $5^{x-8}=(\sqrt5)^x$`,a:R`$5^{x-8}=5^{\frac{x}{2}}$ → $x-8=\frac{x}{2}$ → $x=16$。`},
{q:R`解 $(2^x+5)(2^x-8)=0$`,a:R`$2^x+5>0$ 不可能為 $0$，所以 $2^x=8$ → $x=3$。`},
{q:R`解 $5^x>\frac{1}{25}$；$\left(\frac14\right)^x>\frac{1}{256}$`,a:R`$5^x>5^{-2}$ → $x>-2$。<br>$\left(\frac14\right)^x>\left(\frac14\right)^4$，底數 $<1$ 反向 → $x<4$。`}]},
{u:'2-2',t:R`對數的定義`,
k:R`$b=a^t \iff t=\log_a b$（$a>0,\ a\neq1,\ b>0$）。<br>$\log_a a=1$，$\log_a 1=0$，$a^{\log_a b}=b$。<br>口訣：「$a$ 的幾次方等於 $b$？」答案就是 $\log_a b$。`,
e:{q:R`求 $\log_{\frac12}8$、$\log_9 27$。`,a:R`$8=\left(\frac12\right)^{-3}$ → $-3$。<br>$27=3^3=9^{\frac32}$ → $\frac32$。`},
p:[{q:R`求 $\log_7 49$；$\log_2 2^{0.3}$；$\log_5\frac{1}{5\sqrt5}$`,a:R`$2$；$0.3$；$5\sqrt5=5^{\frac32}$，倒數是 $5^{-\frac32}$ → $-\frac32$。`},
{q:R`$x=\log_5 7$，求 $5^x$、$\left(\frac{1}{25}\right)^x$、$(\sqrt5)^x$。`,a:R`$5^x=7$；$\left(\frac1{25}\right)^x=(5^x)^{-2}=\frac1{49}$；$(\sqrt5)^x=(5^x)^{\frac12}=\sqrt7$。`}]},
{u:'2-2',t:R`常用對數的對數律`,
k:R`$x,y>0$：<br>$\log x+\log y=\log xy$<br>$\log x-\log y=\log\frac{x}{y}$<br>$\log x^r=r\log x$<br>（加→乘、減→除、係數→次方）`,
e:{q:R`求 $\log6+\log50-\log3$。`,a:R`$\log\frac{6\times50}{3}=\log100=2$。`},
p:[{q:R`$\log7+\log8-\log4=\log x$，求 $x$。`,a:R`$\log\frac{7\times8}{4}=\log14$，$x=14$。`},
{q:R`$3\log k-2\log(k+1)+\log4=\log y$，用 $k$ 表示 $y$。`,a:R`$y=\frac{4k^3}{(k+1)^2}$。`},
{q:R`芮氏規模 $5.5$ 地震能量是 $3.5$ 的幾倍？（$\log E=11.8+1.5M$）`,a:R`規模差 $2$ → $10^{1.5\times2}=10^3=1000$ 倍。`}]},
{u:'2-2',t:R`換底公式`,
k:R`$\log_a b=\frac{\log b}{\log a}$。<br>常用化簡：$\log_a b\cdot\log_b c=\log_a c$；$\frac{1}{\log_a b}=\log_b a$。計算機按 $\log$ 再相除即可。`,
e:{q:R`化簡 $\log_3 7+\log_3 10-\log_3 2$。`,a:R`同底直接用對數律：$\log_3\frac{7\times10}{2}=\log_3 35$。`},
p:[{q:R`用一個對數表示 $\log_2 5\times\log_5 3$；及 $\frac{1}{\log_3 7}+\frac{1}{\log_5 7}$`,a:R`$\log_2 3$（約分）。<br>$\log_7 3+\log_7 5=\log_7 15$。`},
{q:R`$\log_2 25+\log_2 28-\log_2 7=\log_2 k$，求 $k$。`,a:R`$k=\frac{25\times28}{7}=100$。`}]},
{u:'2-2',t:R`用對數解指數方程式與不等式`,
k:R`$a^x=b \Rightarrow x=\log_a b$。<br>不等式：把右邊寫成 $a^{\log_a b}$ 再比較。底數 $<1$ 時不等號反向。`,
e:{q:R`解 $3^{x-2}=15$；解 $3^x\ge50$。`,a:R`$x-2=\log_3 15$ → $x=2+\log_3 15$。<br>底數 $3>1$：$x\ge\log_3 50$。`},
p:[{q:R`解 $5^{2x-1}=3$；$3^{2x}+3^x-6=0$`,a:R`$2x-1=\log_5 3$ → $x=\frac{1+\log_5 3}{2}$。<br>令 $t=3^x$：$t^2+t-6=0$ → $t=2$（$t=-3$ 不合）→ $x=\log_3 2$。`},
{q:R`解 $2^x\ge500$；$(0.3)^x\le\frac{1}{100}$`,a:R`$x\ge\log_2 500$。<br>底數 $<1$ 反向：$x\ge\log_{0.3}\frac{1}{100}$。`}]},
{u:'2-2',t:R`指數／對數的生活應用（複利、人口）`,
k:R`列式 → 兩邊取 $\log$（或用對數定義）→ 用計算機。<br>複利：本利和 $=$ 本金 $\times(1+r)^n$。求「至少幾年」要無條件進位。`,
e:{q:R`$10$ 萬元，年利率 $1.5\%$ 複利，幾年後超過 $20$ 萬？`,a:R`$10(1.015)^n>20$ → $n>\frac{\log2}{\log1.015}\approx46.5$，至少 $47$ 年。`},
p:[{q:R`年利率改 $1\%$，幾年後超過 $20$ 萬？`,a:R`$n>\frac{\log2}{\log1.01}\approx69.7$，至少 $70$ 年。`},
{q:R`$P(t)=1500\cdot2^{0.7t}$，人口至少到 $30000$ 要幾年？`,a:R`$2^{0.7x}=20$ → $x=\frac{\log_2 20}{0.7}\approx6.2$，至少 $7$ 年。`}]},
{u:'2-2',t:R`估計大小：科學記號 $a\times10^n$`,
k:R`$N=10^{\log N}$，拆成 $10^{r}\times10^{n}$（$r$ 為小數部分、$n$ 為整數部分）。<br>整數 $N=a\times10^n$ 的位數是 $n+1$。<br>小數 $a\times10^{-m}$：從小數點後第 $m$ 位開始不為 $0$。`,
e:{q:R`$2^{607}-1$ 約多少？幾位數？`,a:R`$607\times\log2\approx182.7252$ → $10^{0.7252}\times10^{182}\approx5.311\times10^{182}$，共 $183$ 位數。`},
p:[{q:R`估計 $\left(\frac13\right)^{300}$，並問小數點後第幾位開始不為 $0$？`,a:R`$-300\log3\approx-143.136=0.864-144$ → 約 $7.305\times10^{-144}$，第 $144$ 位。`}]},
{u:'2-3',t:R`對數函數 $y=\log_a x$ 的圖形性質`,
k:R`定義域 $x>0$，值域全體實數。過 $(1,0)$。<br>$a>1$：遞增；$0<a<1$：遞減。圖形凹口向下（$a>1$ 時）。<br>$y=\log x$ 與 $y=-\log x$ 對稱 $x$ 軸。$\log_a x=\frac{1}{\log a}\log x$。`,
e:{q:R`比較 $a=\log_3 5,\ b=\log_{\frac13}4,\ c=\log_9 16,\ d=0$。`,a:R`換成 $\log$：$a=\frac{\log5}{\log3}$，$b=-\frac{\log4}{\log3}$，$c=\frac{\log4}{\log3}$，$d=0$。因 $\log3>0$ 且 $\log$ 遞增：$a>c>d>b$。`},
p:[{q:R`比較 $a=\log0.7,\ b=0,\ c=\log13,\ d=\log\sqrt{10}$。`,a:R`$\log0.7<0$；$\log13\approx1.11$；$\log\sqrt{10}=0.5$。所以 $c>d>b>a$。`},
{q:R`$f(x)=\log x$ 上兩點 $A(a,r)$、$B(b,s)$，$b-a=3$，$\frac{b}{a}=100$，求直線 $AB$ 斜率。`,a:R`$s-r=\log\frac{b}{a}=2$，斜率 $=\frac{2}{3}$。`}]},
{u:'2-3',t:R`指數函數與對數函數互為反函數`,
k:R`同底的 $a^x$ 與 $\log_a x$ 圖形對稱於直線 $y=x$。<br>點 $(a,b)$ 在指數圖形上 $\iff$ 點 $(b,a)$ 在對數圖形上。`,
e:{q:R`$2^x$ 過 $(3,8)$，則 $\log_2 x$ 過哪一點？`,a:R`坐標對調：$(8,3)$。`},
p:[{q:R`$10^x$ 的圖形過 $(0,1)$，則 $\log x$ 的圖形過哪一點？`,a:R`$(1,0)$。`}]},
{u:'2-3',t:R`解對數方程式與不等式（先管真數 $>0$）`,
k:R`①先列「真數 $>0$」的範圍　②用對數律合併、用定義化成指數　③解完要檢查是否符合範圍（不合要捨去）。<br>不等式：$a>1$ 方向不變，$0<a<1$ 反向，並與真數 $>0$ 取交集。`,
e:{q:R`解 $\log x+\log(x-3)=1$。`,a:R`真數：$x>3$。$\log[x(x-3)]=1$ → $x^2-3x-10=0$ → $x=5$ 或 $-2$，$-2$ 不合，$x=5$。`},
p:[{q:R`解 $\log(x+3)=2$；$\log_2 x+\log_2(x-2)=3$`,a:R`$x+3=100$ → $x=97$。<br>$x(x-2)=8$ → $x=4$ 或 $-2$；需 $x>2$，所以 $x=4$。`},
{q:R`解 $\log(3x-2)\ge2$；$\log_2 x<\log_2(x^2+2)$`,a:R`$3x-2>0$ 且 $3x-2\ge100$ → $x\ge34$。<br>$x>0$ 且 $x<x^2+2$（恆成立）→ $x>0$。`}]},
{u:'2-3',t:R`對數函數的應用`,
k:R`給兩筆資料 → 代入求係數（解聯立）→ 再用模型解不等式。<br>分貝：$d=10\log\frac{I}{I_0}$，$I_0=10^{-12}$。`,
e:{q:R`$P(t)=a-b\log_2 t$，$P(2)=62$，$P(8)=26$，求 $a,b$。`,a:R`$a-b=62$，$a-3b=26$ → $b=18$，$a=80$。`},
p:[{q:R`吹風機 $60\sim80$ 分貝，聲音強度 $I$ 約在什麼範圍？`,a:R`$60=10\log\frac{I}{10^{-12}}$ → $I=10^{-6}$；$80$ 分貝 → $I=10^{-4}$。範圍 $10^{-6}\sim10^{-4}$ W/m²。`}]}
];
let S={},tab='全部';
try{S=JSON.parse(localStorage.getItem('explog')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('explog',JSON.stringify(S))}catch(e){}};
function set(i,v){S[i]=S[i]===v?0:v;save();draw()}
function draw(){
 const T=['全部','2-1 指數函數','2-2 對數與對數律','2-3 對數函數','🤔 待加強','📝 測驗'];
 document.getElementById('tabs').innerHTML=T.map(t=>`<button class="${t.startsWith(tab)?'on':''}" onclick="tab='${t.split(' ')[0]}';draw()">${t}</button>`).join('');
 const done=C.filter((_,i)=>S[i]==1).length;
 document.getElementById('pb').style.width=done/C.length*100+'%';
 document.getElementById('pt').textContent=`已掌握 ${done} / ${C.length} 個概念；待加強 ${C.filter((_,i)=>S[i]==2).length} 個`;
 if(tab=='📝'){drawQuiz();return}let h='';
 C.forEach((c,i)=>{
  if(tab=='🤔'?S[i]!=2:(tab!='全部'&&c.u!=tab))return;
  h+=`<section class="card s${S[i]||0}"><h2><span class="u">${c.u}</span>${c.t}</h2>
  <div class="k"><span class="lab">① 重點</span><br>${c.k}</div>
  <div class="q"><span class="lab">② 例題</span>　${c.e.q}</div>
  <details><summary>看解答</summary><div class="a">${c.e.a}</div></details>
  ${c.p.map((p,j)=>`<div class="q"><span class="lab">③ 隨堂練習 ${j+1}</span>　${p.q}</div><details><summary>對答案</summary><div class="a">${p.a}</div></details>`).join('')}
  <div class="st"><button class="g ${S[i]==1?'on':''}" onclick="set(${i},1)">😀 我懂了</button><button class="r ${S[i]==2?'on':''}" onclick="set(${i},2)">🤔 再看看</button></div></section>`});
 const m=document.getElementById('m');
 m.innerHTML=h||'<div class="empty">這裡還沒有項目 🎉</div>';
 if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([m]);
}
const Q={
'2-1':[
{t:'mc',q:R`下列哪一組數據代表「指數型成長」？（$x=0,1,2,3$ 時的函數值）`,o:[R`$2,4,6,8$`,R`$3,6,12,24$`,R`$10,7,4,1$`,R`$1,4,9,16$`],a:1,e:R`只有 $3,6,12,24$ 每次都 $\times2$（等比）；其餘為等差或不成比例。`},
{t:'mc',q:R`關於 $f(x)=(0.4)^x$ 的圖形，哪一個正確？`,o:[R`由左而右上升`,R`由左而右下降`,R`與 $x$ 軸有交點`,R`不通過 $(0,1)$`],a:1,e:R`底數 $0<0.4<1$，所以嚴格遞減；圖形在 $x$ 軸上方且通過 $(0,1)$。`},
{t:'fb',q:R`解方程式 $3^x=243$，$x=$ ？`,a:['5'],e:R`$243=3^5$，所以 $x=5$。`},
{t:'fb',q:R`某藥物半衰期 $3$ 小時，起初 $80$ mg，$9$ 小時後剩幾 mg？`,a:['10'],e:R`$9\div3=3$ 次半衰期：$80\times\left(\frac12\right)^3=10$。`},
{t:'mc',q:R`解不等式 $\left(\frac12\right)^x>\frac18$，答案是？`,o:[R`$x>3$`,R`$x<3$`,R`$x>-3$`,R`$x<-3$`],a:1,e:R`$\frac18=\left(\frac12\right)^3$，底數 $<1$ 不等號反向，所以 $x<3$。`},
{t:'fb',q:R`解方程式 $\left(\frac12\right)^x=\left(\frac14\right)^{x-1}$，$x=$ ？`,a:['2'],e:R`$\left(\frac12\right)^x=\left(\frac12\right)^{2x-2}$ → $x=2x-2$ → $x=2$。`}
],
'2-2':[
{t:'fb',q:R`求 $\log_2 32$ 的值。`,a:['5'],e:R`$2^5=32$，所以 $\log_2 32=5$。`},
{t:'mc',q:R`$\log4+\log25=$ ？`,o:[R`$2$`,R`$29$`,R`$\log29$`,R`$4$`],a:0,e:R`$\log(4\times25)=\log100=2$。`},
{t:'fb',q:R`$\log_2 3\times\log_3 8=$ ？`,a:['3'],e:R`換底後約分：$\frac{\log3}{\log2}\times\frac{\log8}{\log3}=\log_2 8=3$。`},
{t:'mc',q:R`若 $2^x=7$，則 $x=$ ？`,o:[R`$\log_7 2$`,R`$\log_2 7$`,R`$\frac72$`,R`$\log 7$`],a:1,e:R`依對數定義，$2^x=7 \iff x=\log_2 7$。`},
{t:'fb',q:R`兩個地震的芮氏規模相差 $2$，能量大的是小的幾倍？（$\log E=11.8+1.5M$）`,a:['1000','10^3'],e:R`能量比 $=10^{1.5\times2}=10^3=1000$ 倍。`},
{t:'mc',q:R`$\log_9 27=$ ？`,o:[R`$3$`,R`$\frac32$`,R`$\frac23$`,R`$\frac13$`],a:1,e:R`$27=3^3=9^{\frac32}$，所以 $\log_9 27=\frac32$。`}
],
'2-3':[
{t:'mc',q:R`函數 $f(x)=\log_2 x$ 的定義域是？`,o:[R`所有實數`,R`$x>0$`,R`$x\ge0$`,R`$x<0$`],a:1,e:R`真數必須大於 $0$，所以定義域是 $x>0$。`},
{t:'mc',q:R`$\log5,\ 0,\ \log0.5$ 的大小關係為？`,o:[R`$\log0.5>0>\log5$`,R`$\log5>0>\log0.5$`,R`$0>\log5>\log0.5$`,R`$\log5>\log0.5>0$`],a:1,e:R`$\log x$ 遞增且 $\log1=0$：$5>1$ 所以 $\log5>0$；$0.5<1$ 所以 $\log0.5<0$。`},
{t:'fb',q:R`解方程式 $\log_2(x-1)=5$，$x=$ ？`,a:['33'],e:R`$x-1=2^5=32$，所以 $x=33$。`},
{t:'mc',q:R`$y=2^x$ 與 $y=\log_2 x$ 的圖形對稱於？`,o:[R`$x$ 軸`,R`$y$ 軸`,R`直線 $y=x$`,R`原點`],a:2,e:R`同底的指數函數與對數函數互為反函數，圖形對稱於直線 $y=x$。`},
{t:'fb',q:R`解方程式 $\log x+\log(x-3)=1$，$x=$ ？`,a:['5'],e:R`真數需 $x>3$。$x(x-3)=10$ → $x=5$ 或 $-2$，$-2$ 不合，所以 $x=5$。`},
{t:'fb',q:R`解方程式 $\log(x+3)=2$，$x=$ ？`,a:['97'],e:R`$x+3=10^2=100$，所以 $x=97$。`},
{t:'mc',q:R`解不等式 $\log(x-1)\le2$，解為？`,o:[R`$x\le101$`,R`$1<x\le101$`,R`$x\le100$`,R`$1<x\le100$`],a:1,e:R`真數 $x-1>0$；且 $x-1\le10^2=100$。合併得 $1<x\le101$。`}
]};
let qc='2-1',qa={},qs=false,qbest={};
try{qbest=JSON.parse(localStorage.getItem('explogQ')||'{}')}catch(e){}
const norm=s=>String(s==null?'':s).replace(/[\s$]/g,'').toLowerCase();
const qok=(q,i)=>q.t=='mc'?qa[i]===q.a:q.a.some(x=>norm(x)==norm(qa[i]));
function qpick(c){qc=c;qa={};qs=false;draw()}
function qre(){qa={};qs=false;drawQuiz()}
function qsub(){qs=true;const n=Q[qc].filter(qok).length;qbest[qc]=Math.max(qbest[qc]||0,n);try{localStorage.setItem('explogQ',JSON.stringify(qbest))}catch(e){}drawQuiz();window.scrollTo(0,0)}
function drawQuiz(){
 const L=Q[qc],nm={'2-1':'2-1 指數函數','2-2':'2-2 對數與對數律','2-3':'2-3 對數函數'};
 let h=`<div class="card"><b>選擇測驗章節</b><div class="st">${Object.keys(Q).map(k=>`<button class="${k==qc?'g on':''}" onclick="qpick('${k}')">${nm[k]}${qbest[k]!=null?`<br><small>最高 ${qbest[k]}/${Q[k].length} 題</small>`:''}</button>`).join('')}</div></div>`;
 if(qs){const n=L.filter(qok).length,sc=Math.round(n*100/L.length);
  h+=`<div class="card score"><div class="big">${sc} 分</div>答對 ${n} / ${L.length} 題<br>${sc>=80?'🎉 很棒！觀念很穩了。':sc>=60?'👍 還不錯，看看錯的題目的解析。':'💪 建議回到上面的「重點」再複習，然後按「重做」再試一次。'}</div>`}
 else h+=`<p style="color:var(--mu);font-size:14px">共 ${L.length} 題，每題 ${Math.round(100/L.length*10)/10} 分。填充題請輸入數字（可用分數如 3/2）。沒作答算錯。</p>`;
 L.forEach((q,i)=>{const r=qok(q,i);
  h+=`<div class="card ${qs?(r?'rt':'wr'):''}"><div class="q"><span class="lab">第 ${i+1} 題｜${q.t=='mc'?'選擇題':'填充題'}</span><br>${q.q}</div>`;
  if(q.t=='mc')h+=q.o.map((o,j)=>`<label class="op"><input type="radio" name="q${i}" ${qa[i]===j?'checked':''} ${qs?'disabled':''} onchange="qa[${i}]=${j}"> ${'ABCD'[j]}. ${o}</label>`).join('');
  else h+=`<input class="fb" type="text" inputmode="text" placeholder="輸入答案" value="${String(qa[i]||'').replace(/"/g,'&quot;')}" ${qs?'disabled':''} oninput="qa[${i}]=this.value">`;
  if(qs)h+=`<div class="fd">${r?'✅ 答對了':'❌ 答錯了｜正確答案：'+(q.t=='mc'?'ABCD'[q.a]+'. '+q.o[q.a]:q.a[0])}<br>${q.e}</div>`;
  h+='</div>'});
 h+=qs?`<button class="sub" onclick="qre()">🔁 重做這一章</button>`:`<button class="sub" onclick="qsub()">交卷看分數</button>`;
 const m=document.getElementById('m');m.innerHTML=h;
 if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([m]);
}
draw();
